<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="RefreshGlobal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e1b4b" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- three mailboxes (one colour each) -->
  <g filter="url(#sh)">
    <rect x="34" y="40" width="56" height="44" rx="10" fill="#14b8a6"/>
    <rect x="100" y="32" width="56" height="44" rx="10" fill="#f59e0b"/>
    <rect x="166" y="40" width="56" height="44" rx="10" fill="#f43f5e"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M44 52 62 64 80 52"/>
    <path d="M110 44 128 56 146 44"/>
    <path d="M176 52 194 64 212 52"/>
  </g>
  <!-- merging into one list -->
  <g fill="none" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round">
    <path d="M62 92c0 18 30 18 46 30"/>
    <path d="M128 84v34"/>
    <path d="M194 92c0 18-30 18-46 30"/>
  </g>
  <g filter="url(#sh)">
    <rect x="52" y="126" width="152" height="98" rx="16" fill="#fff"/>
  </g>
  <circle cx="74" cy="149" r="6" fill="#14b8a6"/>
  <rect x="88" y="144" width="96" height="10" rx="5" fill="#c7d2fe"/>
  <circle cx="74" cy="175" r="6" fill="#f59e0b"/>
  <rect x="88" y="170" width="80" height="10" rx="5" fill="#c7d2fe"/>
  <circle cx="74" cy="201" r="6" fill="#f43f5e"/>
  <rect x="88" y="196" width="104" height="10" rx="5" fill="#c7d2fe"/>
</svg>
