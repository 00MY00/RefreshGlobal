name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.1', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: php -l (module)
        run: |
          set -e
          find RefreshGlobal -name '*.php' -not -path '*/Tests/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: shellcheck
        if: matrix.php == '8.2'
        run: |
          shellcheck install.sh tools/build-release.sh
          shellcheck -e SC2015 tests/installer/run_tests.sh tests/installer/full_install_test.sh

  module-tests:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: freescout
          MARIADB_USER: freescout
          MARIADB_PASSWORD: freescout
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
        with:
          path: module
      - uses: actions/checkout@v5
        with:
          repository: freescout-helpdesk/freescout
          path: freescout
      - uses: actions/checkout@v5
        with:
          repository: altmenorg/freescout-refresh
          path: freescout/Modules/Refresh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, zip, curl, intl, imap, pdo_mysql, fileinfo, iconv
          tools: phpunit:11
      - name: Install FreeScout and the modules
        working-directory: freescout
        run: |
          cp -R ../module/RefreshGlobal Modules/RefreshGlobal
          cat > .env <<EOF
          APP_URL=http://localhost
          APP_ENV=production
          APP_KEY=
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=freescout
          DB_USERNAME=freescout
          DB_PASSWORD=freescout
          EOF
          php artisan key:generate --force
          php artisan migrate --force
          php artisan cache:clear
          php artisan module:enable Refresh
          php artisan module:enable RefreshGlobal
          php artisan freescout:module-install refresh
          php artisan freescout:module-install refreshglobal
          php artisan refreshglobal:check
          php artisan config:clear
      - name: Module tests
        working-directory: freescout
        run: phpunit -c Modules/RefreshGlobal/Tests/phpunit.xml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, module-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches module.json
        run: |
          v="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' RefreshGlobal/module.json | head -n 1)"
          test "v${v}" = "${GITHUB_REF_NAME}"
      - name: Build archive
        run: bash tools/build-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RefreshGlobal.zip
            dist/install.sh
            dist/module.json
            dist/SHA256SUMS
