name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.1', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      # a syntax error OR a deprecation fails the job: FreeScout (Laravel 5.5) turns deprecations into errors, e.g. the
      # implicitly nullable parameters deprecated by PHP 8.4 broke the deletion of tickets in 1.17.0
      - name: php -l (module, tests, tools)
        run: |
          set -e
          out=$(find RefreshGlobal tools -name '*.php' -print0 | xargs -0 -n1 php -d error_reporting=E_ALL -d display_errors=stdout -l 2>&1)
          if echo "$out" | grep -E "Deprecated|Parse error|Fatal error"; then exit 1; fi
      - name: shellcheck
        if: matrix.php == '8.2'
        run: |
          shellcheck install.sh tools/build-release.sh
          shellcheck -e SC2015 tests/installer/run_tests.sh tests/installer/full_install_test.sh

  # FreeScout Interop contract (docs/INTEROPERABILITY.md §25): manifest valid and consistent with the code, bridge tests
  interop-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: interop.json
        run: php tools/validate-interop.php
      # tests of the shared bridge (altmenorg/fs-interop, the release recorded in fs-interop.lock.json) on the module's copy
      - uses: actions/checkout@v5
        with:
          repository: altmenorg/fs-interop
          ref: v1.0.0
          path: fs-interop
      - name: FreeScoutInterop bridge
        run: FS_INTEROP_FILE=RefreshGlobal/Public/js/fs-interop.js node fs-interop/tests/fs-interop.test.js

  module-tests:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: freescout
          MARIADB_USER: freescout
          MARIADB_PASSWORD: freescout
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
        with:
          path: module
      - uses: actions/checkout@v5
        with:
          repository: freescout-helpdesk/freescout
          path: freescout
      - uses: actions/checkout@v5
        with:
          repository: altmenorg/freescout-refresh
          path: freescout/Modules/Refresh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, zip, curl, intl, imap, pdo_mysql, fileinfo, iconv
          tools: phpunit:11
      - name: Install FreeScout and the modules
        working-directory: freescout
        run: |
          cp -R ../module/RefreshGlobal Modules/RefreshGlobal
          cat > .env <<EOF
          APP_URL=http://localhost
          APP_ENV=production
          APP_KEY=
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=freescout
          DB_USERNAME=freescout
          DB_PASSWORD=freescout
          EOF
          php artisan key:generate --force
          php artisan migrate --force
          php artisan cache:clear
          php artisan module:enable Refresh
          php artisan module:enable RefreshGlobal
          php artisan freescout:module-install refresh
          php artisan freescout:module-install refreshglobal
          php artisan refreshglobal:check
          php artisan config:clear
      - name: Module tests
        working-directory: freescout
        run: phpunit -c Modules/RefreshGlobal/Tests/phpunit.xml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, interop-contract, module-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches module.json
        run: |
          v="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' RefreshGlobal/module.json | head -n 1)"
          test "v${v}" = "${GITHUB_REF_NAME}"
      - name: Build archive
        run: bash tools/build-release.sh
      - name: Release notes from the CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          # English section of CHANGELOG.md (release notes in English), then a link to the French changelog
          awk -v v="$v" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md
          grep -q "^## \[$v\]" CHANGELOG.fr.md
          printf '\n---\nFrench: [CHANGELOG.fr.md](https://github.com/%s/blob/%s/CHANGELOG.fr.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> dist/release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/RefreshGlobal.zip
            dist/install.sh
            dist/module.json
            dist/version.txt
            dist/SHA256SUMS
